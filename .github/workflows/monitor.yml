name: sunsang24-monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sunsang24-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 파이썬 설치
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 낚시배 조회 및 텔레그램 처리
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_sunsang24.py

      - name: 상태 파일 저장소에 반영
        run: |
          git config user.name "sunsang24-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_schedules.json history.json config.json tg_offset.json
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "update monitor state"
          for i in 1 2 3 4 5; do git fetch origin main; if git rebase origin/main && git push; then echo "저장 완료"; exit 0; fi; git rebase --abort || true; sleep 5; done
          echo "상태 저장 실패"; exit 1
