name: sunsang24-monitor

on:
  schedule:
    # 5분마다 실행 (GitHub 서버 부하에 따라 몇 분 지연될 수 있습니다)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write   # seen_schedules.json 커밋을 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 선상24 조회 및 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_sunsang24.py

      - name: 상태 파일(seen_schedules.json) 저장소에 반영
        run: |
          git config user.name "sunsang24-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_schedules.json
          git diff --staged --quiet || git commit -m "update seen schedules"
          git push
